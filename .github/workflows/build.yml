name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: |
          unzip -o TiltParty-Android.zip
          cd TiltParty-Android
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../TiltParty.apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest TiltParty.apk --title "Tilt Party APK" --notes "Download TiltParty.apk and open it to install."
